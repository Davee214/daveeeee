<html lang="en">
<head>

  <style>
    :root {
      --navy: #14213d; --blue: #315c9d; --blue2: #4677bd; --gold: #d5a94f;

    .search-box { flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 13px; }
    .search-box input { width: 100%; border: 0; outline: 0; }
    select.field, input.field { width: 100%; padding: 0 12px; }
    table { width: 100%; border-collapse: collapse; }

    @keyframes toast-in { from { transform: translateY(15px); opacity: 0; } }

    .student-hero h1 { margin: 8px 0 10px; font: 800 38px/1.12 Manrope; letter-spacing: -1px; }
    .student-hero p { max-width: 620px; margin: 0; color: #dbe4f2; line-height: 1.6; }
    .student-hero .eyebrow { color: #e3c983; }
    .hero-search { height: 50px; display: flex; align-items: center; gap: 12px; max-width: 620px; margin-top: 24px; padding: 0 16px; border-radius: 10px; color: var(--muted); background: white; box-shadow: 0 12px 30px rgba(0,0,0,.16); }
    .hero-search input { width: 100%; border: 0; outline: 0; }
    .student-card-balance { padding: 22px; border-radius: 16px; text-align: center; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); backdrop-filter: blur(8px); }
    .student-card-balance strong { display: block; margin: 4px 0; font: 800 30px Manrope; }
    .student-card-balance span { font-size: 12px; color: #cbd7e8; }
    .student-content { padding: 28px 34px 40px; }
    .student-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .student-stat { padding: 18px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .student-stat-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; font-size: 20px; background: #edf3fa; }
    .student-stat strong { font: 800 24px Manrope; }
    .student-stat span { display: block; color: var(--muted); font-size: 12px; }
    .student-section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
    .student-section-head h2 { margin: 0; font: 800 20px Manrope; }
    .book-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .student-book:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .student-book .cover { width: 76px; height: 108px; display: grid; place-items: center; font-size: 28px; }
    .student-book-copy { display: flex; min-width: 0; flex-direction: column; }
    .student-book-copy h3 { margin: 2px 0 5px; font: 700 15px Manrope; line-height: 1.25; }
    .student-book-copy small { color: var(--muted); }
    .student-book-copy .badge { align-self: flex-start; margin-top: 10px; }
    .student-book-copy button { margin-top: auto; align-self: flex-start; }
    .student-loans { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .student-loan-card { display: grid; grid-template-columns: 55px 1fr auto; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: white; }

    .receipt-brand { display: flex; align-items: center; gap: 12px; padding: 22px 26px; color: white; background: linear-gradient(120deg,var(--navy),var(--blue)); }
    .receipt-brand .brand-mark { width: 38px; height: 38px; font-size: 18px; }
    .receipt-brand strong { font: 800 20px Manrope; }
    .receipt-brand span { display: block; margin-top: 2px; color: #ccd8e9; font-size: 11px; }

    .receipt-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px dashed #cbd2dd; }
    .receipt-heading strong { font: 800 17px Manrope; }
    .receipt-heading small { color: var(--muted); }

    .receipt-detail span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .receipt-detail strong { font-size: 13px; }
    .receipt-book { margin-bottom: 18px; padding: 15px; border-radius: 10px; background: #f5f7fb; }
    .receipt-book span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .receipt-book strong { display: block; margin: 4px 0 2px; font: 700 15px Manrope; }
    .receipt-book small { color: var(--muted); }
    .receipt-notice { padding: 13px 14px; border-left: 4px solid var(--gold); border-radius: 6px; color: #6d6041; background: #fff8e8; font-size: 12px; line-height: 1.5; }

    .student-loans-panel { overflow-x: auto; }

    .student-loans-panel th:last-child, .student-loans-panel td:last-child { min-width: 210px; }
    .student-loans-panel .actions { flex-wrap: nowrap; }
    body { -webkit-font-smoothing: antialiased; background: #f3f5f8; }
    .app-shell { background:
      radial-gradient(circle at 100% 0%, rgba(49,92,157,.07), transparent 300px),
      #f3f5f8; }
    .topbar { height: 76px; box-shadow: 0 2px 18px rgba(20,33,61,.18); }
    .top-search { border: 1px solid rgba(255,255,255,.06); }
    .top-search:focus-within { border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.14); }
    .layout { min-height: calc(100vh - 76px); }
    .sidebar { padding-top: 24px; }
    .nav-item { min-height: 44px; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .nav-item:not(.active):hover { color: var(--blue); background: #f1f5fb; transform: translateX(3px); }
    .main { max-width: 1600px; width: 100%; margin: 0 auto; }
    .page-head h1, .student-section-head h2, .modal-head h3 { color: #172039; }
    .stats-grid .stat-card, .table-wrap, .desk-panel, .panel, .student-stat,

      border-color: rgba(219,224,232,.9);

    .stat-card { position: relative; overflow: hidden; border-radius: 14px !important; }

    .table-wrap, .desk-panel, .panel { border-radius: 14px; }

      .sidebar .nav-item { min-height: 54px; margin: 0 2px; padding: 5px 2px; flex-direction: column; gap: 2px; font-size: 9px; }
      .sidebar .nav-item span:first-child { width: auto; font-size: 17px; }
      .sidebar .nav-item span:last-child { display: block; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-item:not(.active):hover { transform: none; }
      .main { padding: 22px 16px 84px; }.layout { display: block; }.sidebar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; border-top: 1px solid var(--line); }.sidebar .nav-label { display: none; }.nav-item { flex: 1; }.stats-grid { grid-template-columns: 1fr; }.page-head { align-items: flex-start; flex-direction: column; }.topbar { padding: 0 15px; }.session span { display: none; }.form-grid { grid-template-columns: 1fr; }
      .student-shell { margin: -22px -16px -50px; }.student-hero { grid-template-columns: 1fr; padding: 28px 20px; border-radius: 0 0 20px 20px; }.student-card-balance { display: none; }.student-hero h1 { font-size: 30px; }.student-content { padding: 22px 16px 90px; }.student-stats { grid-template-columns: 1fr; }.book-grid, .student-loans { grid-template-columns: 1fr; }.hero-search { padding: 8px 10px; }.hero-search button { white-space: nowrap; }
    }
  </style>
  <style>
    #startup-error { display:none; position:fixed; inset:0; z-index:9999; place-items:center; padding:24px; background:#f6f4ee; color:#20283a; font-family:Arial,sans-serif; }
    #startup-error.visible { display:grid; }
    #startup-error section { width:min(520px,100%); padding:28px; border:1px solid #e5e8ed; border-radius:14px; background:#fff; box-shadow:0 10px 35px rgba(20,33,61,.09); }
    #startup-error h1 { margin:0 0 10px; font-size:22px; }
    #startup-error p { color:#596579; line-height:1.6; }
    #startup-error button { border:0; border-radius:8px; padding:11px 16px; color:#fff; background:#315c9d; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="startup-error" role="alert" aria-live="assertive"><section><h1>LibFlow could not start</h1><p id="startup-error-message">A required app script did not load. Check that your browser is online, then reload this page. If you opened a local file, start Apache in XAMPP and open LibFlow through <code>http://localhost/libflow/</code>.</p><button onclick="location.reload()">Reload LibFlow</button></section></div>
  <script>
    (() => {
      const showStartupError = () => {
        const root = document.getElementById('root');
        if (root && root.childElementCount === 0) document.getElementById('startup-error')?.classList.add('visible');
      };
      window.addEventListener('error', event => {
        if (event.target instanceof HTMLScriptElement || event.message) {
          const message = document.getElementById('startup-error-message');
          if (message && event.message) message.textContent = `LibFlow hit a startup error: ${event.message}. Check the browser connection and reload the page.`;
          setTimeout(showStartupError, 0);
        }
      }, true);
      window.addEventListener('unhandledrejection', event => {
        const message = document.getElementById('startup-error-message');
        if (message) message.textContent = `LibFlow could not finish starting: ${event.reason?.message || 'a required request failed'}. Check that Apache and MySQL are running in XAMPP, then reload the page.`;
        setTimeout(showStartupError, 0);
      });
      setTimeout(showStartupError, 12000);
    })();
  </script>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const addDays = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); };
    const today = () => new Date().toISOString().slice(0,10);
    const money = n => `$${Number(n).toFixed(2)}`;
    const fmt = s => new Date(s + "T00:00:00").toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
    const apiRequest = async (action, method="GET", body=null) => {
      const response = await fetch(`api.php?action=${encodeURIComponent(action)}`, {
        method,
        headers: body ? {"Content-Type":"application/json"} : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.error || "The server request failed");
      return data;
    };

    const seedBooks = [
      {id:"BK-1001", title:"The Midnight Library", author:"Matt Haig", isbn:"9780525559474", category:"Fiction", copies:3, available:2, cover:"M"},
      {id:"BK-1002", title:"Atomic Habits", author:"James Clear", isbn:"9780735211292", category:"Self Help", copies:4, available:4, cover:"A"},
      {id:"BK-1003", title:"The Design of Everyday Things", author:"Don Norman", isbn:"9780465050659", category:"Technology", copies:2, available:1, cover:"D"},
      {id:"BK-1004", title:"Sapiens", author:"Yuval Noah Harari", isbn:"9780062316097", category:"History", copies:3, available:3, cover:"S"},
      {id:"BK-1005", title:"The Alchemist", author:"Paulo Coelho", isbn:"9780061122415", category:"Fiction", copies:2, available:2, cover:"T"},
      {id:"BK-1006", title:"A Brief History of Time", author:"Stephen Hawking", isbn:"9780553380163", category:"Science", copies:2, available:0, cover:"B"},
      {id:"BK-1007", title:"Clean Code", author:"Robert C. Martin", isbn:"9780132350884", category:"Technology", copies:3, available:2, cover:"C"}
    ];
    const seedPatrons = [
      {id:"PT-001", name:"Olivia Martin", email:"olivia.m@student.edu", type:"Student", card:"Active", fines:2.50, joined:"2025-08-12"},
      {id:"PT-002", name:"Ethan Williams", email:"ethan.w@student.edu", type:"Student", card:"Active", fines:0},
      {id:"PT-003", name:"Sophia Chen", email:"sophia.chen@university.edu", type:"Faculty", card:"Active", fines:0},
      {id:"PT-004", name:"Noah Thompson", email:"noah.t@student.edu", type:"Student", card:"Suspended", fines:6.50},
      {id:"PT-005", name:"Mia Rodriguez", email:"mia.r@student.edu", type:"Student", card:"Active", fines:1.00}
    ];
    const seedLoans = [
      {id:"LN-2401", patronId:"PT-001", bookId:"BK-1001", checkedOut:addDays(today(),-9), due:addDays(today(),5), renewals:0},
      {id:"LN-2402", patronId:"PT-002", bookId:"BK-1003", checkedOut:addDays(today(),-22), due:addDays(today(),-8), renewals:1},
      {id:"LN-2403", patronId:"PT-003", bookId:"BK-1004", checkedOut:addDays(today(),-12), due:addDays(today(),18), renewals:0},
      {id:"LN-2404", patronId:"PT-005", bookId:"BK-1006", checkedOut:addDays(today(),-5), due:addDays(today(),9), renewals:0}
    ];
    const seedAudit = [
      {id:"AU-901", action:"Borrowing", detail:"Olivia Martin borrowed The Midnight Library", user:"Librarian", time:"Today, 10:42 AM"},
      {id:"AU-900", action:"Return", detail:"Atomic Habits returned by Ethan Williams", user:"Librarian", time:"Today, 9:18 AM"},
      {id:"AU-899", action:"Fine Settlement", detail:"$4.50 fine paid by Mia Rodriguez", user:"Mia Rodriguez", time:"Yesterday, 3:21 PM"}
    ];

    function App() {
      const [session, setSession] = useState(null);
      const [page, setPage] = useState("Dashboard");
      const [books, setBooks] = useState(seedBooks);
      const [patrons, setPatrons] = useState(seedPatrons);
      const [loans, setLoans] = useState(seedLoans);
      const [history, setHistory] = useState([]);
      const [reservations, setReservations] = useState([]);
      const [audit, setAudit] = useState(seedAudit);
      const [modal, setModal] = useState(null);
      const [toast, setToast] = useState("");
      const [deskBook, setDeskBook] = useState("");
      const [deskPatron, setDeskPatron] = useState("");
      const [query, setQuery] = useState("");
      const [selectedCheckout, setSelectedCheckout] = useState(null);

      useEffect(() => {
        let active = true;
        const loadLibrary = async () => {
          try {
            await apiRequest("bootstrap");
          } catch (setupError) {
            try { await fetch("setup.php").then(r => r.json()); } catch (_) {}
          }
          try {
            const data = await apiRequest("bootstrap");
            if (!active) return;
            setBooks(data.books);
            setPatrons(data.patrons);
            setLoans(data.loans);
            if (data.history) setHistory(data.history);
            if (data.reservations) setReservations(data.reservations);
            setAudit(data.audit);
          } catch (_) {}
        };
        loadLibrary();
        return () => { active = false; };
      }, []);

      const notify = text => { setToast(text); setTimeout(() => setToast(""), 2600); };
      const addAudit = (action, detail) => setAudit(a => [{id:"AU-"+Date.now(),action,detail,user:session?.role==="Admin"?"Librarian":"Student",time:"Just now"}, ...a]);
      const login = (user, loginPatron) => {
        setSession(user.role==="Admin" ? {name:user.name, role:"Admin"} : {name:user.name, role:"Student", patronId:user.patronId});
        setPage(user.role==="Admin" ? "Dashboard" : "Student Home");
        if (user.role==="Student" && loginPatron?.id === user.patronId) {
          setPatrons(current => current.some(p=>p.id===loginPatron.id) ? current : [...current, loginPatron]);
        }
      };
      const activeCount = patronId => loans.filter(l => l.patronId === patronId).length;
      const bookById = id => books.find(b => b.id === id);
      const patronById = id => patrons.find(p => p.id === id);

      if (!session) return <Login onLogin={login} />;
      const nav = session.role==="Admin"
        ? [["Dashboard","⌂"],["Catalog","▤"],["Borrowing Desk","⇄"],["Active Loans","▣"],["Loan History","◷"],["Reservations","◆"],["Students & Fines","♙"],["Reports","▥"],["Audit Log","≡"]]
        : [["Student Home","⌂"],["Catalog","▤"],["My Loans","▣"],["Reservations","◆"]];
      const renderPage = () => {
        if (page==="Dashboard") return <Dashboard books={books} patrons={patrons} loans={loans} setPage={setPage} />;
        if (page==="Student Home") return <StudentHome books={books} patrons={patrons} loans={loans} setPage={setPage} query={query} setQuery={setQuery} session={session} />;
        if (page==="Catalog") {
          const studentLoans = loans.filter(l=>l.patronId===session.patronId).length;
          const studentPatron = patrons.find(p=>p.id===session.patronId) || {};
          const studentBorrowReason = studentPatron.card !== "Active" ? "Your library card is not active" :
            Number(studentPatron.fines || 0) >= 5 ? "Outstanding fines must be below $5.00" :
            studentLoans >= 5 ? "Borrowing limit reached: return a book to borrow another" : "";
          return <Catalog books={books} role={session.role} query={query} setQuery={setQuery} onAdd={()=>setModal("book")} onBorrow={b=>{setDeskBook(b.id); setSelectedCheckout(b); setPage("Borrowing Desk");}} studentBorrowReason={studentBorrowReason} onStudentBorrow={async b=>{try{const result=await apiRequest("checkout","POST",{bookId:b.id,patronId:session.patronId});setLoans(ls=>[...ls,result.loan]);setBooks(bs=>bs.map(x=>x.id===b.id?{...x,available:Number(x.available)-1}:x));setModal({type:"receipt",data:result.loan});notify("Book borrowed successfully");}catch(e){notify(e.message)}}}
            onReserve={async b=>{try{const result=await apiRequest("reservation","POST",{bookId:b.id,patronId:session.patronId});setReservations(rs=>[result.reservation,...rs]);notify("Title reserved successfully")}catch(e){notify(e.message)}}} />;
        }
        if (page==="Borrowing Desk") return <Desk books={books} patrons={patrons} loans={loans} deskBook={deskBook} setDeskBook={setDeskBook} deskPatron={deskPatron} setDeskPatron={setDeskPatron}
          onComplete={async (data)=>{ try { const result=await apiRequest("checkout","POST",data); const loan={...result.loan}; setBooks(bs=>bs.map(b=>b.id===data.bookId? {...b,available:Number(b.available)-1}:b)); setLoans(ls=>[...ls,loan]); setModal({type:"receipt",data:loan}); addAudit("Borrowing",`${patronById(data.patronId)?.name} borrowed ${bookById(data.bookId)?.title}`); } catch(e){notify(e.message);} }} />;
        if (page==="Active Loans" || page==="My Loans") return <Loans books={books} patrons={patrons} loans={loans} student={session.role==="Student"} session={session}
          onRenew={async loan=>{ try { await apiRequest("renew","POST",{loanId:loan.id}); setLoans(ls=>ls.map(l=>l.id===loan.id?{...l,due:addDays(l.due,14),renewals:l.renewals+1}:l)); addAudit("Renewal",`${bookById(loan.bookId)?.title} loan renewed`); notify("Loan renewed by 14 days"); } catch(e){notify(e.message);} }}
          onReturn={loan=>setModal({type:"return",loan})} />;
        if(page==="Students & Fines") return <Patrons patrons={patrons} loans={loans} onAdd={()=>setModal("patron")} onPay={async p=>{try{await apiRequest("pay-fine","POST",{patronId:p.id}); setPatrons(ps=>ps.map(x=>x.id===p.id?{...x,fines:0,card:"Active"}:x));addAudit("Fine Settlement",`${money(p.fines)} paid by ${p.name}`);notify("Fine payment recorded");}catch(e){notify(e.message)}}} />;
        if(page==="Loan History") return <LoanHistory history={history} books={books} patrons={patrons} />;
        if(page==="Reservations") return <Reservations reservations={reservations} books={books} patrons={patrons} student={session.role==="Student"} session={session}
          onCancel={async reservation=>{try{await apiRequest("cancel-reservation","POST",{reservationId:reservation.id});setReservations(rs=>rs.map(r=>r.id===reservation.id?{...r,status:"Cancelled"}:r));notify("Reservation cancelled");}catch(e){notify(e.message)}}} />;
        if(page==="Reports") return <Reports books={books} patrons={patrons} loans={loans} history={history} />;
        if (page==="Audit Log") return <Audit audit={audit} />;
      };

      const confirmReturn = async data => {
        const loan=data.loan;
        try {
        const result=await apiRequest("return","POST",{loanId:loan.id});
        setLoans(ls=>ls.filter(l=>l.id!==loan.id));
        setBooks(bs=>bs.map(b=>b.id===loan.bookId?{...b,available:b.available+1}:b));
        if(result.fine>0) setPatrons(ps=>ps.map(p=>p.id===loan.patronId?{...p,fines:Number(p.fines)+result.fine,card:Number(p.fines)+result.fine>=5?"Suspended":p.card}:p));
        addAudit("Return",`${bookById(loan.bookId)?.title} returned${result.fine>0?` with ${money(result.fine)} overdue fine`:''}`);
        setModal(null); notify("Book checked in successfully");
        } catch(e){notify(e.message);}
      };

      return <div className="app-shell">
        <header className="topbar">
          <div className="brand"><div className="brand-mark">LF</div>LibFlow</div>
          <div className="top-search">⌕<input placeholder="Search catalog, students, ISBN..." onChange={e=>setQuery(e.target.value)} /></div>
          <div className="session"><i className="online"></i><span>{session.name} · {session.role==="Admin"?"Librarian":"Student"}</span><button className="logout" onClick={()=>setSession(null)}>Logout</button></div>
        </header>
        <div className="layout">
          <aside className="sidebar">
            <div className="nav-label">WORKSPACE</div>
            {nav.map(([name,icon])=><button key={name} className={"nav-item "+(page===name?"active":"")} onClick={()=>setPage(name)}><span>{icon}</span><span>{name}</span></button>)}
          </aside>
          <main className="main">{renderPage()}</main>
        </div>
        {modal==="book" && <BookModal onClose={()=>setModal(null)} onSave={async book=>{try{const result=await apiRequest("book","POST",book);setBooks(b=>[...b,{...book,id:result.id,copies:Number(book.copies),available:Number(book.copies),cover:book.title[0].toUpperCase()}]);setModal(null);addAudit("Catalog Update",`${book.title} added to inventory`);notify("Book added to inventory");}catch(e){notify(e.message)}}} />}
        {modal==="patron" && <PatronModal onClose={()=>setModal(null)} onSave={async patron=>{try{const result=await apiRequest("patron","POST",patron);setPatrons(p=>[...p,{...patron,id:result.id,card:"Active",fines:0,joined:today()}]);setModal(null);addAudit("Student Registration",`${patron.name} registered`);notify("Student registered");}catch(e){notify(e.message)}}} />}
        {modal?.type==="return" && <ReturnModal loan={modal.loan} book={bookById(modal.loan.bookId)} patron={patronById(modal.loan.patronId)} onClose={()=>setModal(null)} onConfirm={confirmReturn} />}
        {modal?.type==="receipt" && <ReceiptModal data={modal.data} book={bookById(modal.data.bookId)} patron={patronById(modal.data.patronId)} onClose={()=>setModal(null)} />}
        {toast && <div className="toast">{toast}</div>}
      </div>;
    }

    function Login({onLogin}) {
      const [authMode,setAuthMode] = useState("signin");
      const [name,setName] = useState("");
      const [email,setEmail] = useState("");
      const [password,setPassword] = useState("");
      const [showPassword,setShowPassword] = useState(false);
      const [authError,setAuthError] = useState("");
      const studentLogin = async () => {
        if(authMode==="signup" && (!name.trim() || !email.trim() || password.length < 6)) {
          setAuthError("Complete every field and use a password with at least 6 characters.");
          return;
        }
        if(authMode==="signin" && (!email.trim() || !password.trim())) {
          setAuthError("Enter your email and password.");
          return;
        }
        setAuthError("");
        if(authMode==="signup") {
          try {
            const data = await apiRequest("signup","POST",{name:name.trim(),email:email.trim().toLowerCase(),password});
            onLogin(data.user, data.patron);
            return;
          } catch(error) {
            setAuthError(error.message);
            return;
          }
        }
        try {
          const data = await apiRequest("login","POST",{email:email.trim().toLowerCase(),password});
          onLogin(data.user, data.patron);
        } catch (error) {
          setAuthError(error.message);
        }
      };
      const signIn = async () => {
        if(!email.trim() || !password.trim()) { setAuthError("Enter your email and password."); return; }
        setAuthError("");
        try { const data=await apiRequest("login","POST",{email:email.trim().toLowerCase(),password}); onLogin(data.user,data.patron); }
        catch(error) { setAuthError(error.message); }
      };
      return <div className="login-wrap">
        <section className="login-art">
          <div className="brand"><div className="brand-mark">LF</div>LibFlow</div>
          <h1>Your library,<br/>beautifully organized.</h1>
          <p>A complete workspace for cataloging, circulation, student accounts, and collection insights.</p>
          <div className="login-stats"><div><strong>24,892</strong><span>Books cataloged</span></div><div><strong>3,104</strong><span>Active students</span></div><div><strong>99.8%</strong><span>System uptime</span></div></div>
        </section>
        <section className="login-panel"><div className="login-card">
          <div className="auth-shell">
            <div className="auth-panel-top"><div className="eyebrow">LIBFLOW LIBRARY SYSTEM</div>
            <h2>{authMode==="signup"?"Create student account":"Sign in"}</h2>
            <p>{authMode==="signup"?"Create a student account to browse and borrow books.":"Use your student or administrator account to continue."}</p></div>
            <form className="auth-form" onSubmit={e=>{e.preventDefault();authMode==="signup"?studentLogin():signIn();}}>
              {authMode==="signup"&&<div><label className="field-label">Full Name</label><input className="field" autoComplete="name" required placeholder="Your full name" value={name} onChange={e=>setName(e.target.value)} /></div>}
              <div><label className="field-label">Email</label><input className="field" type="email" autoComplete="email" required placeholder="name@school.edu" value={email} onChange={e=>setEmail(e.target.value)} /></div>
              <div><label className="field-label">Password</label><div className="password-field"><input className="field" type={showPassword?"text":"password"} autoComplete={authMode==="signup"?"new-password":"current-password"} minLength={authMode==="signup"?6:undefined} required placeholder={authMode==="signup"?"Minimum 6 characters":"Enter your password"} value={password} onChange={e=>setPassword(e.target.value)} /><button className="password-toggle" type="button" aria-label={showPassword?"Hide password":"Show password"} onClick={()=>setShowPassword(v=>!v)}>{showPassword?"◉":"○"}</button></div></div>
              {authError&&<div className="auth-error">{authError}</div>}
              <button className="btn auth-submit" type="submit">{authMode==="signup"?"Create Student Account":"Sign In"}</button>
            </form>
            <div className="auth-tabs" style={{display:"flex",justifyContent:"center",marginTop:16,marginBottom:0}}><button className="auth-tab" style={{width:"100%",textAlign:"center"}} type="button" onClick={()=>{setAuthMode(authMode==="signup"?"signin":"signup");setAuthError("");}}>{authMode==="signup"?"Back to sign in":"Create student account"}</button></div>
            <div className="auth-benefits"><span><strong>Browse 24/7</strong>Explore the collection</span><span><strong>Track loans</strong>View due dates</span><span><strong>Renew books</strong>Manage your reading</span></div>
          <div className="login-foot">Secure library access · LibFlow Management System</div>
          </div></div></section>
      </div>;
    }

    function PageHead({title,subtitle,action}) { return <div className="page-head"><div><div className="eyebrow">LIBRARY WORKSPACE</div><h1>{title}</h1><p>{subtitle}</p></div>{action}</div>; }
    function Dashboard({books,patrons,loans,setPage}) {
      const overdue=loans.filter(l=>l.due<today()).length;
      const stats=[["Total Books",books.reduce((n,b)=>n+Number(b.copies),0),"↑ 12 this month","▤"],["Active Students",patrons.filter(p=>p.card==="Active").length,"↑ 8 new students","♙"],["Books on Loan",loans.length,"across all branches","▣"],["Overdue Loans",overdue,overdue+" require attention","!"]];
      return <><PageHead title="Dashboard" subtitle="Here is what is happening in your library today." action={<button className="btn" onClick={()=>setPage("Borrowing Desk")}>+ New Checkout</button>} />
        <div className="stats-grid">{stats.map(([label,value,note,icon])=><div className="stat-card" key={label}><div className="stat-top"><span>{label}</span><span className="stat-icon">{icon}</span></div><strong>{value}</strong><small>{note}</small></div>)}</div>
        <div className="desk-grid"><div className="panel"><div className="panel-head"><h3>Recent Active Loans</h3><button className="btn small secondary" onClick={()=>setPage("Active Loans")}>View all</button></div>
          <table><thead><tr><th>Student</th><th>Due date</th><th>Status</th></tr></thead><tbody>{loans.slice(0,5).map(l=><tr key={l.id}><td>{patrons.find(p=>p.id===l.patronId)?.name}</td><td>{fmt(l.due)}</td><td><span className={"badge "+(l.due<today()?"red":"green")}>{l.due<today()?"Overdue":"On Time"}</span></td></tr>)}</tbody></table>
        </div><div className="panel"><div className="panel-head"><h3>Collection Status</h3></div><div style={{padding:"22px"}}>
          {[["Available",books.reduce((n,b)=>n+Number(b.available),0),"#238568"],["On loan",loans.length,"#315c9d"],["Overdue",overdue,"#d26060"]].map(([label,v,c])=><div key={label} style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"18px"}}><span style={{width:"10px",height:"10px",borderRadius:"50%",background:c}}></span><span style={{flex:1}}>{label}</span><strong>{v}</strong></div>)}
          <button className="btn secondary" style={{width:"100%"}} onClick={()=>setPage("Catalog")}>Manage Catalog</button>
        </div></div></div></>;
    }

    function StudentHome({books,patrons,loans,setPage,query,setQuery,session}) {
      const [currentTime,setCurrentTime]=useState(()=>new Date());
      useEffect(()=>{
        const timer=setInterval(()=>setCurrentTime(new Date()),60000);
        return ()=>clearInterval(timer);
      },[]);
      const patron = patrons.find(p=>p.id===session.patronId) || patrons[0] || {};
      const myLoans = loans.filter(l=>l.patronId===patron.id);
      const overdue = myLoans.filter(l=>l.due<today()).length;
      const featured = books.filter(b=>Number(b.available)>0).slice(0,3);
      return <div className="student-shell">
        <section className="student-hero">
          <div><div className="eyebrow">STUDENT READING PORTAL</div><h1>{currentTime.getHours()<12?"Good morning":currentTime.getHours()<17?"Good afternoon":"Good evening"}, {patron.name?.split(" ")[0]||"Reader"}.</h1><p>Discover your next great read and keep track of everything you have borrowed.</p><div className="hero-search">⌕<input placeholder="Search titles, authors, or ISBN..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&setPage("Catalog")} /><button className="btn" onClick={()=>setPage("Catalog")}>Browse</button></div></div>
          <div className="student-card-balance"><span>LIBRARY CARD</span><strong>{money(patron.fines||0)}</strong><span>{Number(patron.fines||0)>=5?"Account suspended":"Outstanding balance"}</span><div style={{height:"1px",background:"rgba(255,255,255,.16)",margin:"16px 0"}}></div><span className="badge green">{patron.card||"Active"} Account</span></div>
        </section>
        <div className="student-content">
          <div className="student-stats">
            {[["▣","Active loans",`${myLoans.length} of 5 books`],["◷","Due soon",myLoans.filter(l=>l.due>=today()).length+" upcoming loans"],["!","Overdue",overdue+" needs attention"]].map(([icon,label,value])=><div className="student-stat" key={label}><div className="student-stat-icon">{icon}</div><div><strong>{value.split(" ")[0]}</strong><span>{label} · {value.substring(value.indexOf(" ")+1)}</span></div></div>)}
          </div>
          <div className="student-section-head"><h2>Recommended for you</h2><button className="btn small secondary" onClick={()=>setPage("Catalog")}>Explore catalog →</button></div>
          <div className="book-grid">{featured.map(b=><div className="student-book" key={b.id}><div className="cover">{b.cover}</div><div className="student-book-copy"><small>{b.category}</small><h3>{b.title}</h3><small>{b.author}</small><span className="badge green">{b.available} available</span><button className="btn small secondary" onClick={()=>setPage("Catalog")}>View title</button></div></div>)}</div>
          {myLoans.length>0&&<><div className="student-section-head" style={{marginTop:"28px"}}><h2>Your current loans</h2><button className="btn small secondary" onClick={()=>setPage("My Loans")}>View all</button></div><div className="student-loans">{myLoans.map(l=>{const book=books.find(b=>b.id===l.bookId)||{};return <div className="student-loan-card" key={l.id}><div className="cover">{book.cover}</div><div><strong>{book.title}</strong><small>{book.author}</small></div><div className="due"><small>Due date</small><strong>{fmt(l.due)}</strong><span className={"badge "+(l.due<today()?"red":"green")} style={{display:"flex",marginTop:"7px"}}>{l.due<today()?"Overdue":"On time"}</span></div></div>})}</div></>}
        </div>
      </div>;
    }

    function Catalog({books,role,query,setQuery,onAdd,onBorrow,onStudentBorrow,onReserve,studentBorrowReason=""}) {
      const [category,setCategory]=useState("All");
      const filtered=books.filter(b=>(category==="All"||b.category===category)&&(`${b.title} ${b.author} ${b.isbn}`.toLowerCase().includes(query.toLowerCase())));
      const categories=["All",...new Set(books.map(b=>b.category))];
      if (role==="Student") return <><PageHead title="Explore the Catalog" subtitle={`${filtered.length} titles available to discover`} action={<span className="badge blue">Student access</span>} />
        <div className="filters"><div className="search-box">⌕<input placeholder="Search by title, author, or ISBN..." value={query} onChange={e=>setQuery(e.target.value)} /></div><select className="field" style={{width:"180px"}} value={category} onChange={e=>setCategory(e.target.value)}>{categories.map(c=><option key={c}>{c}</option>)}</select></div>
        {studentBorrowReason&&<div className="receipt-notice" style={{marginBottom:"16px"}}><strong>Borrowing is currently unavailable.</strong><br/>{studentBorrowReason}</div>}
        <div className="book-grid">{filtered.map(b=><article className="student-book" key={b.id}><div className="cover">{b.cover}</div><div className="student-book-copy"><small>{b.category}</small><h3>{b.title}</h3><small>{b.author}</small><span className={"badge "+(b.available?"green":"red")}>{Number(b.available)>0?`${b.available} available`:"All copies on loan"}</span>{Number(b.available)>0?<button className="btn small" disabled={Boolean(studentBorrowReason)} onClick={()=>onStudentBorrow(b)}>Borrow Now</button>:<button className="btn small secondary" onClick={()=>onReserve(b)}>Reserve Title</button>}</div></article>)}</div>{!filtered.length&&<div className="empty">No books match your search.</div>}
      </>;
      return <><PageHead title="Catalog & Inventory" subtitle={`${books.length} titles in the collection`} action={role==="Admin"&&<button className="btn" onClick={onAdd}>+ Add New Book</button>} />
        <div className="filters"><div className="search-box">⌕<input placeholder="Search by title, author, or ISBN..." value={query} onChange={e=>setQuery(e.target.value)} /></div><select className="field" style={{width:"180px"}} value={category} onChange={e=>setCategory(e.target.value)}>{categories.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="panel"><table><thead><tr><th>Book</th><th>Category</th><th>ISBN</th><th>Copies</th><th>Availability</th>{role==="Admin"&&<th></th>}</tr></thead><tbody>{filtered.map(b=><tr key={b.id}><td><div className="book-cell"><div className="cover">{b.cover}</div><div><strong>{b.title}</strong><small>{b.author}</small></div></div></td><td>{b.category}</td><td>{b.isbn}</td><td>{b.copies}</td><td><span className={"badge "+(b.available?"green":"red")}>{b.available} available</span></td>{role==="Admin"&&<td><button className="btn small" disabled={!b.available} onClick={()=>onBorrow(b)}>Select for Borrowing</button></td>}</tr>)}</tbody></table>{!filtered.length&&<div className="empty">No books match your search.</div>}</div>
      </>;
    }

    function Desk({books,patrons,loans,deskBook,setDeskBook,deskPatron,setDeskPatron,onComplete}) {
      const patron=patrons.find(p=>p.id===deskPatron);
      const active=loans.filter(l=>l.patronId===deskPatron).length;
      const cardOK=patron?.card==="Active";
      const finesOK=(patron?.fines||0)<5;
      const limitOK=active<5;
      const all=cardOK&&finesOK&&limitOK&&deskBook;
      const days=patron?.type==="Faculty"?30:14;
      const submit=()=>{if(!all)return;onComplete({patronId:deskPatron,bookId:deskBook,checkedOut:today(),due:addDays(today(),days),renewals:0});};
      return <><PageHead title="Borrowing Desk" subtitle="Validate a student and issue a new checkout."/>
        <div className="desk-grid"><div className="panel"><div className="panel-head"><h3>Checkout Details</h3><span className="badge blue">{all?"Ready to issue":"Validation required"}</span></div><div className="desk-form">
          <label className="field-label">Select Student</label><select className="field" value={deskPatron} onChange={e=>setDeskPatron(e.target.value)}><option value="">Choose a registered student...</option>{patrons.map(p=><option key={p.id} value={p.id}>{p.name} · {p.id}</option>)}</select>
          <label className="field-label">Select Available Book Copy</label><select className="field" value={deskBook} onChange={e=>setDeskBook(e.target.value)}><option value="">Choose an available title...</option>{books.filter(b=>b.available>0).map(b=><option key={b.id} value={b.id}>{b.title} · {b.available} copy available</option>)}</select>
          <div className="validation-box"><strong style={{fontSize:"13px"}}>Automated Validation</strong>
            {[[cardOK, "Card status: Active"],[finesOK, "Fine balance under $5.00"],[limitOK, "Active loans below 5 books"]].map(([ok,label],i)=><div className="check-row" key={i}><span>{label}</span><span className={"badge "+(ok?"green":"red")}>{patron?(ok?"Pass":"Blocked"):"Waiting"}</span></div>)}
          </div><button className="btn" style={{width:"100%",marginTop:"18px"}} disabled={!all} onClick={submit}>Issue Book & Generate Receipt</button>
        </div></div><div className="panel"><div className="panel-head"><h3>Checkout Summary</h3></div><div className="desk-form">
          <div className="receipt-preview"><h4>LIBFLOW · CHECKOUT</h4><div>Student: {patron?.name||"—"}</div><div>Account: {patron?.type||"—"}</div><hr/><div>Book: {books.find(b=>b.id===deskBook)?.title||"—"}</div><div>Due: {deskBook&&patron?fmt(addDays(today(),days)):"—"}</div><div>Loan term: {patron?days+" days":"—"}</div></div>
        </div></div></div></>;
    }

    function Loans({books,patrons,loans,student,session,onRenew,onReturn}) {
      const shown=student?loans.filter(l=>l.patronId===session.patronId):loans;
      return <><PageHead title={student?"My Loans":"Active Loans"} subtitle={student?"Track your borrowed books and due dates":"Manage renewals, returns, and overdue accounts"} />
        <div className={"panel "+(student?"student-loans-panel":"")}><table><thead><tr><th>Book</th>{!student&&<th>Student</th>}<th>Checked Out</th><th>Due Date</th><th>Renewals</th><th>Status</th><th>{student?"Actions":"Actions"}</th></tr></thead><tbody>{shown.map(l=>{const overdue=l.due<today(); return <tr key={l.id}><td><div className="book-cell"><div className="cover">{books.find(b=>b.id===l.bookId)?.cover}</div><div><strong>{books.find(b=>b.id===l.bookId)?.title}</strong><small>{l.id}</small></div></div></td>{!student&&<td>{patrons.find(p=>p.id===l.patronId)?.name}</td>}<td>{fmt(l.checkedOut)}</td><td>{fmt(l.due)}</td><td>{l.renewals} / 2</td><td><span className={"badge "+(overdue?"red":"green")}>{overdue?"Overdue":"On-Time"}</span></td><td><div className="actions">{student?<><button className="btn small secondary" disabled={l.renewals>=2||overdue} onClick={()=>onRenew(l)}>Renew</button><button className="btn small danger" onClick={()=>onReturn(l)}>Return Book</button></>:<><button className="btn small secondary" disabled={l.renewals>=2||overdue} onClick={()=>onRenew(l)}>Renew</button><button className="btn small" onClick={()=>onReturn(l)}>Return</button></>}</div></td></tr>})}</tbody></table>{!shown.length&&<div className="empty">No active loans.</div>}</div></>;
    }
    function patronName(patrons,id){return patrons.find(p=>p.id===id)?.name;}
    function bookName(books,id){return books.find(b=>b.id===id)?.title || id;}
    function LoanHistory({history,books,patrons}) {
      const [query,setQuery]=useState("");
      const shown=history.filter(l=>`${bookName(books,l.bookId)} ${patronName(patrons,l.patronId)} ${l.id}`.toLowerCase().includes(query.toLowerCase()));
      return <><PageHead title="Loan History" subtitle="View every checkout and return in the circulation records" />
        <div className="filters"><div className="search-box">⌕<input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search student, title, or loan ID..." /></div></div>
        <div className="panel"><table><thead><tr><th>Loan</th><th>Book</th><th>Student</th><th>Checked Out</th><th>Due Date</th><th>Status</th></tr></thead><tbody>{shown.map(l=><tr key={l.id}><td>{l.id}</td><td>{bookName(books,l.bookId)}</td><td>{patronName(patrons,l.patronId)}</td><td>{fmt(l.checkedOut)}</td><td>{fmt(l.due)}</td><td><span className={"badge "+(l.status==="Returned"?"blue":l.due<today()?"red":"green")}>{l.status}</span></td></tr>)}</tbody></table>{!shown.length&&<div className="empty">No loan records match this search.</div>}</div></>;
    }
    function Reservations({reservations,books,patrons,student,session,onCancel}) {
      const shown=student?reservations.filter(r=>r.patronId===session.patronId):reservations;
      return <><PageHead title="Reservations" subtitle={student?"Track titles you are waiting to borrow":"Manage the library waiting list"} />
        <div className="panel"><table><thead><tr><th>Reservation</th><th>Title</th>{!student&&<th>Student</th>}<th>Reserved</th><th>Status</th>{student&&<th></th>}</tr></thead><tbody>{shown.map(r=><tr key={r.id}><td>{r.id}</td><td>{bookName(books,r.bookId)}</td>{!student&&<td>{patronName(patrons,r.patronId)}</td>}<td>{fmt(r.reservedAt?.slice(0,10)||today())}</td><td><span className={"badge "+(r.status==="Pending"?"amber":r.status==="Cancelled"?"red":"green")}>{r.status}</span></td>{student&&<td>{r.status==="Pending"&&<button className="btn small danger" onClick={()=>onCancel(r)}>Cancel</button>}</td>}</tr>)}</tbody></table>{!shown.length&&<div className="empty">No reservations found.</div>}</div></>;
    }
    function Reports({books,patrons,loans,history}) {
      const overdue=loans.filter(l=>l.due<today());
      const dueSoon=loans.filter(l=>l.due>=today()&&l.due<=addDays(today(),7));
      const printReport=()=>window.print();
      const exportCSV=()=>{const rows=[["Metric","Value"],["Total titles",books.length],["Copies",books.reduce((n,b)=>n+Number(b.copies),0)],["Active loans",loans.length],["Overdue loans",overdue.length],["Due next 7 days",dueSoon.length],["Registered students",patrons.length],["Loan records",history.length]];const csv=rows.map(r=>r.join(",")).join("\n");const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));link.download="libflow-report.csv";link.click();URL.revokeObjectURL(link.href)};
      const cards=[["Collection titles",books.length,"Titles"],["Registered copies",books.reduce((n,b)=>n+Number(b.copies),0),"Physical copies"],["Due in 7 days",dueSoon.length,"Upcoming"],["Overdue loans",overdue.length,"Requires action"]];
      return <><div className="report-print"><PageHead title="Reports" subtitle="Circulation summaries and collection overview" action={<div style={{display:"flex",gap:"10px"}}><button className="btn secondary" onClick={printReport}>Print Report</button><button className="btn secondary" onClick={exportCSV}>Export CSV</button></div>} />
        <div className="stats-grid">{cards.map(([label,value,note])=><div className="stat-card" key={label}><div className="stat-top"><span>{label}</span></div><strong>{value}</strong><small>{note}</small></div>)}</div>
        <div className="desk-grid"><div className="panel"><div className="panel-head"><h3>Books Due Soon</h3></div>{dueSoon.length?<table><thead><tr><th>Book</th><th>Student</th><th>Due</th></tr></thead><tbody>{dueSoon.map(l=><tr key={l.id}><td>{bookName(books,l.bookId)}</td><td>{patronName(patrons,l.patronId)}</td><td>{fmt(l.due)}</td></tr>)}</tbody></table>:<div className="empty">No loans are due this week.</div>}</div><div className="panel"><div className="panel-head"><h3>Overdue Accounts</h3></div>{overdue.length?<table><thead><tr><th>Book</th><th>Student</th><th>Days</th></tr></thead><tbody>{overdue.map(l=><tr key={l.id}><td>{bookName(books,l.bookId)}</td><td>{patronName(patrons,l.patronId)}</td><td>{Math.max(1,Math.floor((new Date(today())-new Date(l.due))/86400000))}</td></tr>)}</tbody></table>:<div className="empty">There are no overdue loans.</div>}</div></div></div></>;
    }

    function Patrons({patrons,loans,onAdd,onPay}) {
      return <><PageHead title="Students & Fines" subtitle="Manage registered library members and account balances." action={<button className="btn" onClick={onAdd}>+ Register Student</button>} />
        <div className="panel"><table><thead><tr><th>Student</th><th>Member Type</th><th>Card Status</th><th>Active Loans</th><th>Unpaid Fines</th><th></th></tr></thead><tbody>{patrons.map(p=><tr key={p.id}><td><div className="patron-cell"><div className="patron-avatar">{p.name.split(" ").map(n=>n[0]).join("")}</div><div><strong>{p.name}</strong><small>{p.email}</small></div></div></td><td>{p.type}</td><td><span className={"badge "+(p.card==="Active"?"green":"red")}>{p.card}</span></td><td>{loans.filter(l=>l.patronId===p.id).length} / 5</td><td><strong>{money(p.fines)}</strong></td><td>{p.fines>0&&<button className="btn small secondary" onClick={()=>onPay(p)}>Pay Fines</button>}</td></tr>)}</tbody></table></div></>;
    }

    function Audit({audit}) {
      return <><PageHead title="Transaction Audit Log" subtitle="Immutable record of circulation and financial events."/>
        <div className="panel"><table><thead><tr><th>Event</th><th>Transaction</th><th>Recorded By</th><th>Time</th></tr></thead><tbody>{audit.map(a=><tr key={a.id}><td><span className="badge blue">{a.action}</span></td><td>{a.detail}</td><td>{a.user}</td><td>{a.time}</td></tr>)}</tbody></table></div></>;
    }

    function Modal({title,children,onClose,wide=false}) { return <div className="modal-backdrop" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><div className={"modal "+(wide?"wide":"")}><div className="modal-head"><h3>{title}</h3><button className="close" onClick={onClose}>×</button></div>{children}</div></div>; }
    function BookModal({onClose,onSave}) {
      const [v,setV]=useState({title:"",author:"",isbn:"",category:"Fiction",copies:1});
      return <Modal title="Add New Book" onClose={onClose}><div className="modal-body"><div className="form-grid">
        {[["title","Title","The Midnight Library"],["author","Author","Author name"]].map(([k,l,p])=><div className="full" key={k}><label className="field-label">{l}</label><input className="field" placeholder={p} value={v[k]} onChange={e=>setV({...v,[k]:e.target.value})}/></div>)}
        <div><label className="field-label">ISBN</label><input className="field" value={v.isbn} onChange={e=>setV({...v,isbn:e.target.value})}/></div><div><label className="field-label">Copies</label><input className="field" type="number" min="1" value={v.copies} onChange={e=>setV({...v,copies:e.target.value})}/></div>
        <div className="full"><label className="field-label">Category</label><select className="field" value={v.category} onChange={e=>setV({...v,category:e.target.value})}>{["Fiction","Science","History","Technology","Self Help","Reference"].map(c=><option key={c}>{c}</option>)}</select></div>
      </div></div><div className="modal-foot"><button className="btn secondary" onClick={onClose}>Cancel</button><button className="btn" disabled={!v.title||!v.author} onClick={()=>onSave(v)}>Add to Inventory</button></div></Modal>;
    }
    function PatronModal({onClose,onSave}) {
      const [v,setV]=useState({name:"",email:"",type:"Student"});
      return <Modal title="Register New Student" onClose={onClose}><div className="modal-body"><div className="form-grid"><div className="full"><label className="field-label">Full Name</label><input className="field" value={v.name} onChange={e=>setV({...v,name:e.target.value})}/></div><div className="full"><label className="field-label">Email Address</label><input className="field" type="email" value={v.email} onChange={e=>setV({...v,email:e.target.value})}/></div><div className="full"><label className="field-label">Member Type</label><select className="field" value={v.type} onChange={e=>setV({...v,type:e.target.value})}><option>Student</option><option>Faculty</option></select></div></div></div><div className="modal-foot"><button className="btn secondary" onClick={onClose}>Cancel</button><button className="btn" disabled={!v.name||!v.email} onClick={()=>onSave(v)}>Register Student</button></div></Modal>;
    }
    function ReturnModal({loan,book,patron,onClose,onConfirm}) {
      const days=Math.max(0,Math.floor((new Date(today())-new Date(loan.due))/86400000));
      const fine=days*.5;
      return <Modal title="Return & Check-in Book" onClose={onClose}><div className="modal-body">
        <div className="book-cell" style={{paddingBottom:"18px"}}><div className="cover">{book.cover}</div><div><strong>{book.title}</strong><small>{loan.id} · {patron.name}</small></div></div>
        <div className="validation-box"><div className="check-row"><span>Due date</span><strong>{fmt(loan.due)}</strong></div><div className="check-row"><span>Days overdue</span><strong>{days}</strong></div><div className="check-row"><span>Calculated fine</span><strong>{money(fine)}</strong></div></div>
      </div><div className="modal-foot"><button className="btn secondary" onClick={onClose}>Cancel</button><button className="btn" onClick={()=>onConfirm({loan,fine})}>Confirm Check-in</button></div></Modal>;
    }
    function ReceiptModal({data,book,patron,onClose}) {
      return <Modal title="Digital Checkout Receipt" onClose={onClose} wide><div className="modal-body print-area"><div className="receipt-sheet">
        <div className="receipt-brand"><div className="brand-mark">LF</div><div><strong>LibFlow</strong><span>LIBRARY MANAGEMENT SYSTEM</span></div></div>
        <div className="receipt-content">
          <div className="receipt-heading"><strong>Checkout Receipt</strong><small>RC-{data.id?.replace(/\D/g,"").slice(-8)||Date.now().toString().slice(-8)}</small></div>
          <div className="receipt-grid">
            <div className="receipt-detail"><span>Student</span><strong>{patron.name}</strong></div>
            <div className="receipt-detail"><span>Library Card</span><strong>{patron.id}</strong></div>
            <div className="receipt-detail"><span>Checked Out</span><strong>{fmt(data.checkedOut)}</strong></div>
            <div className="receipt-detail"><span>Due Date</span><strong>{fmt(data.due)}</strong></div>
          </div>
          <div className="receipt-book"><span>Borrowed Book</span><strong>{book.title}</strong><small>{book.author}</small></div>
          <div className="receipt-notice"><strong>Please return this book by {fmt(data.due)}.</strong><br/>Overdue fines accrue at $0.50 per day.</div>
          <div className="receipt-footer">This receipt is generated by LibFlow · Keep it for your records</div>
        </div>
      </div></div><div className="modal-foot"><button className="btn secondary" onClick={onClose}>Close</button><button className="btn" onClick={()=>window.print()}>Print Receipt</button></div></Modal>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
